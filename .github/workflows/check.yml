name: Check homework

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout student code
        uses: actions/checkout@v4

      - name: Checkout hidden tests
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.HOMEWORK_TESTS_REPO }}
          token: ${{ secrets.HOMEWORK_TESTS_TOKEN }}
          path: .hidden-tests

      - name: Overlay hidden tests
        run: |
          mkdir -p src/test/java
          cp -R .hidden-tests/src/test/java/. src/test/java/

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Run tests
        run: mvn -B test
